[theme]
source = "builtin"
custom_palette = "Peach"
mode = "dark"
shell_mode = "dark"

[shell]
settings_window_translucent = true
corner_radius_scale = 1.35
offline_mode = false
shared_gl_context = true
font_family = "Fira Sans"
popup_shadows = true

[shell.animation]
speed = 1.6
enabled = true

[shell.shadow]
alpha = 0.38

[shell.panel]
control_center_position = "center"
control_center_placement = "floating"
list_item_background = true
border_color = "#7aa2f7aa"
border_width = 1.5
transparency_mode = "glass"

[backdrop]
enabled = true
blur_intensity = 0.55
tint_intensity = 0.15

[lockscreen]
blur_intensity = 0.35
transition = []

[bar.main]
panel_overlap = 1
border = "outline_variant"
radius_bottom_right = 16
radius_bottom_left = 16
radius_top_right = 16
radius_top_left = 16
hover_highlight = true
show_on_workspace_switch = true
auto_hide_reserve_space = true
capsule_opacity = 0.78
font_weight = 600
contact_shadow = true
border_width = 1.0
background_opacity = 0.42
compositor_blur = true
shadow = true
smart_auto_hide = true
auto_hide = false
reserve_space = true
capsule = true
thickness = 32
padding = 12
widget_spacing = 5
radius = 16
capsule_padding = 3
capsule_thickness = 0.72
capsule_radius = 14.0
capsule_border = "outline_variant"
capsule_border_width = 1.0
margin_ends = "8%"
margin_edge = 6
concave_edge_corners = true
start = ["group:g0", "workspaces", "active_window"]
center = ["clock"]
end = ["media", "wallpaper", "clipboard", "screenshot", "group:g1", "group:g3"]

[[bar.main.capsule_group]]
id = "g1"
members = ["network", "bluetooth", "volume", "brightness", "battery", "sysmon"]
fill = "surface_container_high"
foreground = "primary"
padding = 6.0
radius = 16
border = "primary"
border_width = 1.0
opacity = 0.86
enabled = true
accordion = false
widget_spacing = 8

[[bar.main.capsule_group]]
id = "g0"
members = ["arch", "launcher", "cat", "pomo"]
fill = "surface_container_high"
foreground = "primary"
padding = 5.0
radius = 12
border = "outline_variant"
border_width = 1.0
opacity = 0.86
enabled = true
accordion = false
widget_spacing = 6

[[bar.main.capsule_group]]
id = "g3"
members = ["tray", "notifications", "privacy", "nightlight", "caffeine", "control-center", "session"]
fill = "surface_container"
foreground = "on_surface_variant"
padding = 5.0
radius = 12
border = "outline_variant"
border_width = 1.0
opacity = 0.86
enabled = true
accordion = false
widget_spacing = 6

[bar.main.dead_zone.actions]
left = "panel-toggle launcher"
right = "panel-toggle control-center"
middle = "exec kitty"
scroll_up = "workspace-switch prev"
scroll_down = "workspace-switch next"

[osd.kinds]
media = false
media_volume = false

[system.monitor]
enabled = true
cpu_poll_seconds = 10.0
memory_poll_seconds = 10.0
gpu_poll_seconds = 0.0
network_poll_seconds = 0.0
disk_poll_seconds = 0.0

[shell.launcher]
width = 820
track_usage = true
sort_by_usage = false
colorize_icons = false
fetch_exchange_rates = false
default_view = "all"
show_app_actions = true
category_icons_only = true
search_position = "top"
pinned = ["kitty", "brave-browser", "org.gnome.Nautilus", "obsidian", "zen"]

[shell.launcher.dmenu.entry.eyecare]
command = "echo 'Night light'; echo 'Blue-light filter'; echo 'Grayscale'; echo 'Dim'; echo 'Reset all'"
exec = "/home/sahil/.local/bin/eye-care.sh {selection}"
prefix = "eye"
label = "Eye care"
glyph = "eye"
global = false

[shell.launcher.dmenu.entry.glass]
command = "/home/sahil/.local/bin/glass-mode.sh --list"
exec = "/home/sahil/.local/bin/glass-mode.sh \"{selection}\""
prefix = "glass"
label = "Glass mode"
glyph = "eye"
global = false

[shell.window_switcher]
colorize_icons = false
style = "icons"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false

[shell.screenshot]
directory = "/home/sahil/Pictures/screenshots"

[control_center]
hidden_tabs = ["weather", "calendar", "screen-time"]

[control_center.media]
show_visualizer = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[wallpaper.automation]
enabled = false

[plugins]
auto_update = "none"
enabled = ["noctalia/notes", "cleboost/ssh-launcher", "cleboost/zed-provider", "nightwatch75/file-search", "noctalia/bongocat", "thepunkoff/pomodoro"]

[plugin_settings."noctalia/notes"]
notes_dir = "/home/sahil/Documents/noctalia-notes"
extension = "md"

[plugin_settings."cleboost/ssh-launcher"]
config_path = "/home/sahil/.ssh/config"
max_results = 30

[plugin_settings."cleboost/zed-provider"]
db_path = "/home/sahil/.local/share/zed/db/0-stable/db.sqlite"
max_results = 20
new_window = false

[plugin_settings."nightwatch75/file-search"]
search_folder = "/home/sahil"
exclude_dirs = ".git, node_modules, .cache, .venv"
space_enabled = false

[widget.active_window]
display = "icon_and_text"
max_length = 145
title_scroll = "on_hover"
show_empty_label = false

[widget.clock]
color = "on_surface"
capsule_fill = "surface_container_highest"
format = "{:%a %d %b  %H:%M}"
tooltip_format = "%A, %B %d, %Y"
font_scale = 1.15
font_weight = 700
capsule_padding = 8
capsule_radius = 14
capsule_border = "secondary"
capsule_border_width = 1.0

[widget.privacy]
hide_inactive = true

[widget.sysmon]
peek = true

[widget.volume]
color = "primary"
peek = true

[widget.brightness]
color = "tertiary"
peek = true

[widget.brightness.actions]
right = "panel-open launcher /eye"

[widget.battery]
color = "primary"
peek = true

[widget.tray]
hide_passive = true
drawer_item_size = 20
drawer_columns = 3
glyph_position = "before"
drawer = true
peek = true

[widget.eye]
show_glyph = true
type = "custom_button"
glyph = "eye"
custom_label = ""

[widget.eye.actions]
left = "panel-open launcher /eye"

[widget.arch]
type = "custom_button"
custom_image = "/home/sahil/.config/noctalia/assets/archlinux-logo.svg"
custom_image_colorize = true
label = ""

[widget.arch.actions]
left = "panel-toggle launcher"

[notification]
max_visible = 4
width = 380
background_opacity = 0.88

[osd]
position = "top_right"
background_opacity = 0.88
hide_delay_ms = 2000

[dock]
position = "bottom"
pinned = ["kitty", "brave-browser", "org.gnome.Nautilus", "firefox"]
reserve_space = false
auto_hide = false
smart_auto_hide = true
enabled = true
launcher_position = "start"
active_scale = 1.05
magnification_scale = 1.35
icon_size = 44
margin_edge = 8
radius = 20
border_width = 1.5
background_opacity = 0.72
compositor_blur = true

[widget.workspaces]
change_color_on_hover = true
hide_when_empty = false
pill_scale = 0.85
inactive_pill_size = 1.0
active_pill_size = 2.4
urgent_color = "error"
empty_color = "outline_variant"
occupied_color = "secondary"
focused_color = "primary"
show_icons = false
show_labels = false
style = "focus_hint"
type = "workspaces"
[widget.cat]
type = "noctalia/bongocat:cat"
audio_spectrum = true
tappy_mode = true
input_devices = []

[widget.pomo]
type = "thepunkoff/pomodoro:widget"
widget-glyph-main = "brain"
widget-glyph-work = "brain"
widget-glyph-break = "coffee"

[plugin_settings."thepunkoff/pomodoro"]
work-duration = 25
short-break-duration = 5
long-break-duration = 15
sessions-before-long-break = 4

[widget.network]
color = "primary"
peek = true

[widget.bluetooth]
color = "secondary"
peek = true

[widget.media]
title_scroll = "on_hover"
max_length = 200
hide_when_idle = true
hide_when_no_media = true
art_size = 18
album_art_only = true
