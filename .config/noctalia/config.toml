[theme]
source = "custom"
custom_palette = "Peach"
mode = "dark"
shell_mode = "dark"

[shell]
offline_mode = true
shared_gl_context = true
font_family = "Fira Sans"
popup_shadows = false

[shell.animation]
enabled = false

[shell.shadow]
alpha = 0.0

[shell.panel]
transparency_mode = "solid"

[backdrop]
enabled = false
blur_intensity = 0.0
tint_intensity = 0.0

[lockscreen]
blur_intensity = 0.0
transition = []

[bar.main]
compositor_blur = false
shadow = false
smart_auto_hide = false
capsule = true
thickness = 38
padding = 10
widget_spacing = 8
radius = 16
capsule_padding = 5
capsule_thickness = 0.82
capsule_radius = 14.0
capsule_border = "outline_variant"
capsule_border_width = 1.0
margin_ends = 100
margin_edge = 0
concave_edge_corners = true
start = ["launcher", "wallpaper", "workspaces", "taskbar"]
center = ["clock"]
end = ["tray", "privacy", "notifications", "group:g1", "group:g2", "group:g3", "screenshot", "eye", "control-center", "session", "sysmon", "arch"]

[[bar.main.capsule_group]]
id = "g1"
members = ["network", "bluetooth"]
fill = "surface_container"
foreground = "primary"
padding = 5.0
radius = 12
border = "outline_variant"
border_width = 1.0
opacity = 1.0
enabled = true
accordion = false
widget_spacing = 8

[[bar.main.capsule_group]]
id = "g2"
members = ["volume", "brightness"]
fill = "surface_container"
foreground = "primary"
padding = 5.0
radius = 12
border = "outline_variant"
border_width = 1.0
opacity = 1.0
enabled = true
accordion = false
widget_spacing = 8

[[bar.main.capsule_group]]
id = "g3"
members = ["battery", "nightlight"]
fill = "surface_container"
foreground = "primary"
padding = 5.0
radius = 12
border = "outline_variant"
border_width = 1.0
opacity = 1.0
enabled = true
accordion = false
widget_spacing = 8

[bar.main.dead_zone.actions]
left = "panel-toggle launcher"
right = "panel-toggle control-center"
middle = "exec kitty"
scroll_up = "workspace-switch prev"
scroll_down = "workspace-switch next"

[osd.kinds]
media = false
media_volume = false

[system.monitor]
enabled = true
cpu_poll_seconds = 10.0
memory_poll_seconds = 10.0
gpu_poll_seconds = 0.0
network_poll_seconds = 0.0
disk_poll_seconds = 0.0

[shell.launcher]
fetch_exchange_rates = false
default_view = "all"
show_app_actions = true
category_icons_only = true
search_position = "top"
pinned = ["kitty", "brave-browser", "org.gnome.Nautilus", "obsidian", "zen"]

[shell.launcher.dmenu.entry.eyecare]
command = "echo 'Night light'; echo 'Blue-light filter'; echo 'Grayscale'; echo 'Dim'; echo 'Reset all'"
exec = "/home/sahil/.local/bin/eye-care.sh {selection}"
prefix = "eye"
label = "Eye care"
glyph = "eye"
global = false

[shell.window_switcher]
colorize_icons = false
style = "icons"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false

[shell.screenshot]
directory = "/home/sahil/Pictures/screenshots"

[control_center]
hidden_tabs = ["weather", "calendar", "screen-time"]

[control_center.media]
show_visualizer = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[wallpaper.automation]
enabled = false

[plugins]
auto_update = "none"
enabled = ["noctalia/notes", "noctalia/timer"]

[plugin_settings."noctalia/notes"]
notes_dir = "/home/sahil/Documents/noctalia-notes"
extension = "md"

[widget.clock]
format = "{:%a %d %b  %H:%M}"
tooltip_format = "%A, %B %d, %Y"
font_scale = 1.15
font_weight = 700
capsule_padding = 7
capsule_radius = 12
capsule_border = "primary"
capsule_border_width = 1.0

[widget.privacy]
hide_inactive = true

[widget.sysmon]
peek = true

[widget.volume]
peek = true

[widget.brightness]
peek = true

[widget.brightness.actions]
right = "panel-open launcher /eye"

[widget.battery]
peek = true

[widget.tray]
peek = true

[widget.eye]
type = "custom_button"
glyph = "eye"
custom_label = "Eye"

[widget.eye.actions]
left = "panel-open launcher /eye"

[widget.arch]
type = "custom_button"
custom_image = "/home/sahil/.config/noctalia/assets/archlinux-logo.svg"
custom_image_colorize = false
label = ""

[widget.arch.actions]
left = "none"
