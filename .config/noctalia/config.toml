# Minimal low-heat overrides on top of Noctalia's stock defaults.
# Stock look retained: Noctalia palette, dock, bar, rounded panels.
# Sources: docs.noctalia.dev configuration/shell, services/system-monitor,
# bar, theming — accessed 2026-11-22. Validated with `noctalia config validate`.

[theme]
source = "builtin"
builtin = "Tokyo-Night"
mode = "dark"
shell_mode = "dark"

[shell]
offline_mode = true          # no weather/exchange-rate/community-palette HTTP calls
shared_gl_context = true
font_family = "Fira Sans"

[shell.animation]
enabled = false              # kill shell animations; stock layout/colours remain

[shell.shadow]
alpha = 0.0

[shell.panel]
transparency_mode = "solid"

[backdrop]
enabled = false
blur_intensity = 0.0
tint_intensity = 0.0

[bar.main]
compositor_blur = false
shadow = false
capsule = true
end = ['media', 'tray', 'notifications', 'clipboard', 'group:g1', 'group:g2', 'group:g3', 'screenshot', 'control-center', 'session', 'sysmon']

[[bar.main.capsule_group]]
id = "g1"
members = ["network", "bluetooth"]
fill = "surface_container"
padding = 6.0
opacity = 0.9
enabled = true
accordion = false
widget_spacing = 8

[[bar.main.capsule_group]]
id = "g2"
members = ["volume", "brightness"]
fill = "surface_container"
padding = 6.0
opacity = 0.9
enabled = true
accordion = false
widget_spacing = 8

[[bar.main.capsule_group]]
id = "g3"
members = ["battery", "nightlight"]
fill = "surface_container"
padding = 6.0
opacity = 0.9
enabled = true
accordion = false
widget_spacing = 8

[wallpaper.automation]
enabled = false

# Slower sysmon polling; widgets stay, work is reduced.
[system.monitor]
enabled = true
cpu_poll_seconds = 10.0
memory_poll_seconds = 10.0
gpu_poll_seconds = 0.0
network_poll_seconds = 10.0
disk_poll_seconds = 30.0

[shell.launcher]
fetch_exchange_rates = false
default_view = "all"
show_app_actions = true
category_icons_only = true
search_position = "top"

# Win+Tab overview: all windows across all workspaces/outputs.
[shell.window_switcher]
colorize_icons = false
style = "icons"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false

[shell.screenshot]
directory = "/home/sahil/Pictures/screenshots"

[widget.sysmon]
peek = true

[widget.volume]
peek = true

[widget.brightness]
peek = true

[widget.battery]
peek = true

[widget.tray]
peek = true

[control_center]
hidden_tabs = ["weather", "calendar", "screen-time"]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[plugins]
auto_update = "none"

[widget.brightness.actions]
right = "panel-open launcher /eye"

[shell.launcher.dmenu.entry.eyecare]
command = "echo 'Night light'; echo 'Blue-light filter'; echo 'Grayscale'; echo 'Dim'; echo 'Reset all'"
exec = "/home/sahil/.local/bin/eye-care.sh {selection}"
prefix = "eye"
label = "Eye care"
glyph = "eye"
global = false
