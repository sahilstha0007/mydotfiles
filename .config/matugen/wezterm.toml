# Standalone matugen config: ONLY wezterm colors, never touches ml4w/hyprland.
# Used by ~/.config/wezterm/utils/sync-wallpaper.sh
[config]

[templates.wezterm]
input_path = '~/.config/matugen/templates/wezterm-colors.lua'
output_path = '~/.config/wezterm/colors/matugen.lua'

# btop joins wezterm here for the same reason kitty did: it used to be generated
# by the ml4w config.toml from a DIFFERENT wallpaper, so it showed a palette no
# other terminal shared. Its 37 semantic keys all resolve from the same tokens
# as the wezterm template, so no generator script is needed — unlike kitty,
# which needs wezterm's RESOLVED ansi/brights and therefore reads custom.lua
# (utils/kitty-palette.sh). Changing a wallpaper repaints btop's theme file;
# btop itself only re-reads it on restart.
[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
