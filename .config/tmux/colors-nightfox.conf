# =============================================================================
# Nightfox palette tokens for tmux (under Kitty)
# Upstream: https://github.com/EdenEast/nightfox.nvim
# =============================================================================

set -g @catppuccin_flavor "mocha"

# Base backgrounds & text
set -g @thm_bg "#192330"
set -g @thm_fg "#cdcecf"
set -g @thm_base "#192330"
set -g @thm_text "#cdcecf"

# Accents (repaired to >= 4.5:1 across flat #192330, surface_0 #212e3f, and 0.85 glass #3c444f)
set -g @thm_rosewater "#f6b079"
set -g @thm_flamingo "#f4a261"
set -g @thm_pink "#df97dc"
set -g @thm_mauve "#bda5e3"
set -g @thm_red "#e19dae"
set -g @thm_maroon "#e19dae"
set -g @thm_peach "#f4a261"
set -g @thm_yellow "#dbc074"
set -g @thm_green "#8db9a4"
set -g @thm_teal "#63cdcf"
set -g @thm_sky "#7ad5d6"
set -g @thm_sapphire "#90b2df"
set -g @thm_blue "#90b2df"
set -g @thm_lavender "#bda5e3"

# Subtext ramps
set -g @thm_subtext_1 "#afb0b1"
set -g @thm_subtext1 "#afb0b1"
set -g @thm_subtext_0 "#a6b1be"
set -g @thm_subtext0 "#a6b1be"

# Overlay ramps (borders, separators, comments — >= 4.5:1 across flat, surface_0, and 0.85 glass)
set -g @thm_overlay_2 "#a6b1be"
set -g @thm_overlay2 "#a6b1be"
set -g @thm_overlay_1 "#a7b1bc"
set -g @thm_overlay1 "#a7b1bc"
set -g @thm_overlay_0 "#a7b1bc"
set -g @thm_overlay0 "#a7b1bc"

# Surface ramps (statusline, popups, selection — surface_2 >= 3.0:1 non-text border on #192330 & 0.85 glass)
set -g @thm_surface_2 "#7391b6"
set -g @thm_surface2 "#7391b6"
set -g @thm_surface_1 "#29394f"
set -g @thm_surface1 "#29394f"
set -g @thm_surface_0 "#212e3f"
set -g @thm_surface0 "#212e3f"
set -g @thm_glass "#212e3f"

# Mantle & crust
set -g @thm_mantle "#131a24"
set -g @thm_crust "#0e141c"
