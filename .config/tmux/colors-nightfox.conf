# =============================================================================
# Nightfox palette tokens for tmux (under Kitty)
# Upstream: https://github.com/EdenEast/nightfox.nvim
# =============================================================================

set -g @catppuccin_flavor "mocha"

# Base backgrounds & text (Glass gradient matching Basel design)
set -g @thm_bg "#192330"
set -g @thm_fg "#cbe9fd"
set -g @thm_base "#192330"
set -g @thm_text "#cbe9fd"

# Accents (Vibrant Blue & Frosted Cyan Glass)
set -g @thm_rosewater "#f6b079"
set -g @thm_flamingo "#f4a261"
set -g @thm_pink "#d67ad2"
set -g @thm_mauve "#9d79d6"
set -g @thm_red "#c94f6d"
set -g @thm_maroon "#d16983"
set -g @thm_peach "#f4a261"
set -g @thm_yellow "#dbc074"
set -g @thm_green "#81b29a"
set -g @thm_teal "#63cdcf"
set -g @thm_sky "#7ad5d6"
set -g @thm_sapphire "#1951fc"
set -g @thm_blue "#3781fc"
set -g @thm_lavender "#cbe9fd"

# Subtext ramps
set -g @thm_subtext_1 "#86abdc"
set -g @thm_subtext1 "#86abdc"
set -g @thm_subtext_0 "#719cd6"
set -g @thm_subtext0 "#719cd6"

# Overlay ramps (borders, separators, comments)
set -g @thm_overlay_2 "#828f9f"
set -g @thm_overlay2 "#828f9f"
set -g @thm_overlay_1 "#738091"
set -g @thm_overlay1 "#738091"
set -g @thm_overlay_0 "#3781fc"
set -g @thm_overlay0 "#3781fc"

# Surface ramps (statusline, popups, selection)
set -g @thm_surface_2 "#1951fc"
set -g @thm_surface2 "#1951fc"
set -g @thm_surface_1 "#0b2cb1"
set -g @thm_surface1 "#0b2cb1"
set -g @thm_surface_0 "#03195b"
set -g @thm_surface0 "#03195b"

# Mantle & crust
set -g @thm_mantle "#131a24"
set -g @thm_crust "#0e141c"
