# =============================================================================
# Kanagawa palette tokens for tmux (Kitty coding profile)
# Mirrors colors-nightfox.conf so every @thm_* token in tmux.conf resolves.
# Upstream: https://github.com/rebelot/kanagawa.nvim
# =============================================================================

set -g @catppuccin_flavor "mocha"

# Base backgrounds & text
set -g @thm_bg "#1f1f28"
set -g @thm_fg "#dcd7ba"
set -g @thm_base "#1f1f28"
set -g @thm_text "#dcd7ba"

# Accents
set -g @thm_rosewater "#e6c384"
set -g @thm_flamingo "#ffa066"
set -g @thm_pink "#ff5d62"
set -g @thm_mauve "#957fb8"
set -g @thm_red "#c34043"
set -g @thm_maroon "#e82424"
set -g @thm_peach "#ffa066"
set -g @thm_yellow "#e6c384"
set -g @thm_green "#76946a"
set -g @thm_teal "#6a9589"
set -g @thm_sky "#7aa89f"
set -g @thm_sapphire "#7fb4ca"
set -g @thm_blue "#7e9cd8"
set -g @thm_lavender "#938aa9"

# Subtext ramps
set -g @thm_subtext_1 "#c8c093"
set -g @thm_subtext1 "#c8c093"
set -g @thm_subtext_0 "#a8a19f"
set -g @thm_subtext0 "#a8a19f"

# Overlay ramps (borders, separators, comments)
set -g @thm_overlay_2 "#7aa89f"
set -g @thm_overlay2 "#7aa89f"
set -g @thm_overlay_1 "#727169"
set -g @thm_overlay1 "#727169"
set -g @thm_overlay_0 "#727169"
set -g @thm_overlay0 "#727169"

# Surface ramps (statusline, popups, selection)
set -g @thm_surface_2 "#54546d"
set -g @thm_surface2 "#54546d"
set -g @thm_surface_1 "#2d4f67"
set -g @thm_surface1 "#2d4f67"
set -g @thm_surface_0 "#16161d"
set -g @thm_surface0 "#16161d"
set -g @thm_glass "#16161d"

# Mantle & crust
set -g @thm_mantle "#16161d"
set -g @thm_crust "#0d0c13"
