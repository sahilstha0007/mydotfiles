# =============================================================================
# Apple Dark Glass palette tokens for tmux (Kitty coding profile)
# Mirrors colors-kanagawa.conf so every @thm_* token in tmux.conf resolves.
# macOS dark-mode system colors; one accent (#0a84ff), grayscale ramps.
# =============================================================================

set -g @catppuccin_flavor "mocha"

# Base backgrounds & text (Apple labels)
set -g @thm_bg "#1c1c1e"
set -g @thm_fg "#f5f5f7"
set -g @thm_base "#1c1c1e"
set -g @thm_text "#f5f5f7"

# Accents — softened Apple system hues, one true accent (blue)
set -g @thm_rosewater "#f7e6a3"
set -g @thm_flamingo "#ff9f0a"
set -g @thm_pink "#ff375f"
set -g @thm_mauve "#cba6f0"
set -g @thm_red "#ff6b6b"
set -g @thm_maroon "#ff8a80"
set -g @thm_peach "#ff9f0a"
set -g @thm_yellow "#f2d97a"
set -g @thm_green "#7dce8b"
set -g @thm_teal "#64d2ff"
set -g @thm_sky "#9fdcf5"
set -g @thm_sapphire "#5aa9ff"
set -g @thm_blue "#0a84ff"
set -g @thm_lavender "#dcb8f5"

# Subtext ramps (Apple label colors)
set -g @thm_subtext_1 "#ebebf5"
set -g @thm_subtext1 "#ebebf5"
set -g @thm_subtext_0 "#a1a1a6"
set -g @thm_subtext0 "#a1a1a6"

# Overlay ramps (borders, separators, comments — tertiary label)
set -g @thm_overlay_2 "#98989d"
set -g @thm_overlay2 "#98989d"
set -g @thm_overlay_1 "#6e6e73"
set -g @thm_overlay1 "#6e6e73"
set -g @thm_overlay_0 "#6e6e73"
set -g @thm_overlay0 "#6e6e73"

# Surface ramps (system fills)
set -g @thm_surface_2 "#6e6e73"
set -g @thm_surface2 "#6e6e73"
set -g @thm_surface_1 "#3a3a3c"
set -g @thm_surface1 "#3a3a3c"
set -g @thm_surface_0 "#2c2c2e"
set -g @thm_surface0 "#2c2c2e"
set -g @thm_glass "#2c2c2e"

# Mantle & crust
set -g @thm_mantle "#1c1c1e"
set -g @thm_crust "#141416"
