# =============================================================================
# Catppuccin Mocha palette tokens for tmux (Kitty coding profile)
# Mirrors colors-nightfox.conf so every @thm_* token in tmux.conf resolves.
# Upstream: https://github.com/catppuccin/catppuccin
# =============================================================================

set -g @catppuccin_flavor "mocha"

# Base backgrounds & text
set -g @thm_bg "#1E1E2E"
set -g @thm_fg "#CDD6F4"
set -g @thm_base "#1E1E2E"
set -g @thm_text "#CDD6F4"

# Accents
set -g @thm_rosewater "#F5E0DC"
set -g @thm_flamingo "#F2CDCD"
set -g @thm_pink "#F5C2E7"
set -g @thm_mauve "#CBA6F7"
set -g @thm_red "#F38BA8"
set -g @thm_maroon "#EBA0AC"
set -g @thm_peach "#FAB387"
set -g @thm_yellow "#F9E2AF"
set -g @thm_green "#A6E3A1"
set -g @thm_teal "#94E2D5"
set -g @thm_sky "#89DCEB"
set -g @thm_sapphire "#74C7EC"
set -g @thm_blue "#89B4FA"
set -g @thm_lavender "#B4BEFE"

# Subtext ramps
set -g @thm_subtext_1 "#BAC2DE"
set -g @thm_subtext1 "#BAC2DE"
set -g @thm_subtext_0 "#A6ADC8"
set -g @thm_subtext0 "#A6ADC8"

# Overlay ramps (borders, separators, comments)
set -g @thm_overlay_2 "#9399B2"
set -g @thm_overlay2 "#9399B2"
set -g @thm_overlay_1 "#7F849C"
set -g @thm_overlay1 "#7F849C"
set -g @thm_overlay_0 "#6C7086"
set -g @thm_overlay0 "#6C7086"

# Surface ramps (statusline, popups, selection)
set -g @thm_surface_2 "#585B70"
set -g @thm_surface2 "#585B70"
set -g @thm_surface_1 "#45475A"
set -g @thm_surface1 "#45475A"
set -g @thm_surface_0 "#313244"
set -g @thm_surface0 "#313244"
set -g @thm_glass "#313244"

# Mantle & crust
set -g @thm_mantle "#181825"
set -g @thm_crust "#11111B"
