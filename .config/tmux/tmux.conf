set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Prefix key
set -g prefix C-a
set -g prefix2 None
unbind C-b
bind C-a send-prefix

# THEME: matugen only. It defines all 26 @thm_* tokens, so catppuccin/tmux was a
# second writer, fully overwritten by the very next source-file. It also created
# a real bug: the flavor if-shell read @catppuccin_flavor BEFORE colors-matugen.conf
# set it, so a cold boot sourced macchiato and every reload after it sourced mocha.
# Only the wallpaper writes this palette now.

# ---- Status bar ----------------------------------------------------------
# Left, in reading order: session identity, then what the focused pane is
# running, then where it is. Right: transient modes, host, load, clock.
# Every colour is an @thm_* token — see the THEME note at the top. This file
# contains no literal hex and neither should anything added to it.
#
# The │ separators are @thm_overlay_0, a TEXT token, so colors-from-matugen.sh
# guards it against the status background at 4.5:1 — a separator you cannot see
# is a separator not doing its job.
#
# GOTCHA, and it has already bitten this file once: a comma inside an #[...]
# style terminates the enclosing #{?cond,true,false} at that comma. Writing
#   #{?pane_in_mode,#[fg=#{@thm_bg},bg=#{@thm_red},bold] COPY ,}
# renders the literal text "#[fg=#13140d" and silently drops everything after
# it — no error, the option still "works", the mode indicator just never
# appears. So every SGR sitting INSIDE a conditional is written comma-free, as
# separate #[fg=..]#[bg=..]#[bold] runs. Verified by rendering each format
# through display-message -p and reading the result, not by eyeballing it.
# Lengths are budgets, not maximums — tmux TRUNCATES status-left to fit whatever
# is left after the right side and the centred window list. These were 180/120,
# which need ~300 columns; on a 234-col terminal that pushed status-left off the
# left edge entirely, so the PREFIX pill, session name and cwd were all still
# set but never rendered (which reads as "the prefix indicator is broken").
# Sized to the real content instead: the pill + separators + a 45-col truncated
# path is ~71, and the right side (mode flags, host, loadavg, date) is ~40.
# Roomy enough to stay stable on a wide monitor, small enough to survive a
# laptop at 1200px. Below ~150 total, tmux starts eating the centred window
# list — which is a worse loss than a clipped path.
set -g status-left-length 85
set -g status-right-length 74
set -g status-left ""
# --- session name: fg-only on wallpaper backdrop.
# Note: session name keeps #[fg=#{@thm_green}] for the check-colour-propagation gate.
set -ga status-left "#{?client_prefix,#[fg=#{@thm_yellow}]#[bold]󰌌 PREFIX #[fg=#{@thm_green}]#[bold] #S,#[fg=#{@thm_green}] #S}"
set -ga status-left "#[fg=#{@thm_overlay_0},none] │ "
set -ga status-left "#[fg=#{@thm_maroon},bold]#{pane_current_command}"
set -ga status-left "#[fg=#{@thm_overlay_0},none] │ "
# 󰉋 folder glyph + cwd truncated from the LEFT: the tail names the project
set -ga status-left "#[fg=#{@thm_blue}]󰉋 #{=/-35/...:#{s|$HOME|~:#{pane_current_path}}} "
# --- Transient mode indicators: clear badges when active, silent when inactive
set -ga status-left "#{?window_zoomed_flag,#[fg=#{@thm_yellow}]#[bold]│ 󰁌 ZOOM ,}"
set -ga status-left "#{?pane_in_mode,#[fg=#{@thm_red}]#[bold]│ 󰆏 COPY ,}"
set -ga status-left "#{?pane_synchronized,#[fg=#{@thm_yellow}]#[bold]│ 󰓦 SYNC ,}"
set -g status-right ""
# --- Right side: the pane's WORKING CONTEXT (decided 2026-10-13, direction A). ---
# Answers "what is this pane doing?" — the one thing tmux uniquely owns and no
# other layer shows. wezterm's bar carries the machine (clock/host/CPU/RAM/
# battery), nvim's lualine carries the buffer (file/diag/LSP/git-hunks), tmux's
# LEFT carries session identity + cwd + mode. The right side carries the pane's
# live dev state:
#   git     branch + dirty + ahead/behind (hidden while nvim owns the pane —
#           lualine shows the buffer's repo then, so it's never printed twice)
#   agents  count of running coding-agent processes (claude/opencode/cline/…)
#   pods    running podman containers, by count + name
# Each segment emits NOTHING when empty (a clean shell in a non-repo dir shows
# only what's true), so the bar never clutters. All three are cached helper
# scripts in scripts/ (git per-dir 5s, containers 10s, agents 5s) so the
# status-interval re-run stays cheap.
#
# Replaced a rotating keyboard-hint coach (status-hint.sh) on 2026-10-13: the
# user found the hints a tutorial for keys they already know. This is the
# signal-contract default — useful pane state, not instruction.
#
# Colour is @thm_* tokens only (no literal hex — see the THEME note at top).
# git is TWO segments (branch=mauve identity, state=yellow) because a #()
# segment paints its whole output in one colour.
set -ga status-right "#[fg=#{@thm_mauve}]#(~/.config/tmux/scripts/git-info.sh '#{pane_current_path}' '#{pane_current_command}')"
set -ga status-right "#[fg=#{@thm_yellow}]#(~/.config/tmux/scripts/git-state.sh '#{pane_current_path}' '#{pane_current_command}')"
set -ga status-right "#[fg=#{@thm_teal}]#(~/.config/tmux/scripts/agents.sh)"
set -ga status-right "#[fg=#{@thm_sapphire}]#(~/.config/tmux/scripts/containers.sh)"
set -g status-position top
set -g status-justify "absolute-centre"
# ---- Transparent status bar (wallpaper shows through) ----
# tmux has no alpha — bg=#rrggbbaa and bg=rgba(...) are both rejected as
# "invalid style" on this build (tested on 3.7c). The "transparent" look
# therefore lives in wezterm's backdrop opacity (appearance.lua -> backdrops.lua,
# opacity = 0.82), and the status bar itself carries NO background: every segment
# is fg-only text on the wallpaper. No filled pills, no surface tokens used as bg.
# Ref: hang-on-0812 screenshot desired look.
# (status-style, message-style, mode-style set ONCE here — the duplicate block
# below near pane-border styling is removed; there is exactly one of each.)
set -g status-style "fg=#{@thm_fg},bg=none"
set -g message-style "fg=#{@thm_blue},bg=#{@thm_surface_0},bold"
set -g message-command-style "fg=#{@thm_red},bg=#{@thm_surface_0},bold"
set -g mode-style "fg=#{@thm_bg},bg=#{@thm_blue}"
set -g window-status-style "none"
set -g window-status-current-style "none"

# Window list: active window uses accent chip + bold fg; inactive windows use
# soft legible subtext (@thm_subtext_0: ~8.3:1 contrast, @thm_overlay_1: ~5.1:1).
# Automatic rename uses smart detection: shows folder name when shell is active,
# or running command (nvim, lazygit, python, etc.) otherwise.
set -g window-status-format "#[fg=#{@thm_overlay_1}]#I #[fg=#{@thm_subtext_0}]#W#{?window_activity_flag, #[fg=#{@thm_yellow}]•,#{?window_bell_flag, #[fg=#{@thm_red}]!,}}"
set -g window-status-last-style "none"
set -g window-status-activity-style "fg=#{@thm_red},bold"
set -g window-status-bell-style "fg=#{@thm_red},bold"
set -g window-status-separator "   "
# ▸ + bold are the non-colour focus cue; active window is unmistakably clear.
set -g window-status-current-format "#[fg=#{@thm_blue},bold]▸ #I #[fg=#{@thm_fg},bold]#W#{?window_zoomed_flag, #[fg=#{@thm_yellow}]󰁌,}"
set -wg automatic-rename on
set -g automatic-rename-format "#{?#{m/r:(zsh|bash|sh|fish),#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"

# Undercurl
set -g default-terminal "tmux-256color"
# Truecolor for ANY capable outer terminal (kitty, wezterm TERM=xterm-256color,
# ghostty). nvim renders 24-bit colors inside tmux only if tmux knows the
# outer terminal supports Tc.
set -as terminal-overrides ',*:Tc'
# Cursor shape: the outer terminal's terminfo may lack Ss/Se, so tmux can't
# switch cursor styles (nvim insert-mode beam, etc). Teach it regardless of
# which emulator is outside.
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Allow OSC passthrough (kitty/wezterm supports it)
set -g allow-passthrough on
set-environment -g SNACKS_WEZTERM 1

# Toggle tmux status bar
# Dead: the unconditional `set -g status on` two lines below always wins, so this
# could never change the outcome. Kept as a record of the original intent.
# It also forked `$(tmux lsw | wc -l)` + an if-shell on every config load and
# every Prefix+r, and if-shell blocks the command queue while it runs.
# if-shell "[[ $(tmux lsw | wc -l) -le 1 ]]" 'set -g status'
# 2026-10-10: the `bind '' set status` line that lived here errored at every
# load (empty key -> "unknown key", flashed in the status message area and
# caught by the colour-propagation capture). Removed; the record above is the
# reason the toggle no longer exists.

set -g status on

# Enable mouse
set -g mouse on

# Start windows and panes at 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ESC disambiguation delay. NOT zero: 0 breaks Alt/Alt-bare-ESC detection, so
# alt-prefixed sequences and any program sending a lone ESC get mangled. tmux
# 3.x defaults to 10; that is the value, not a perf knob.
#
# ORDERING: keep this ABOVE the `run '.../tpm'` line further down -- see the
# note there. escape-time 0 would break Alt-key detection, so this value
# matters and its position relative to plugin load is load-bearing.
set -gs escape-time 10

# keybindings
# Reload the config and report completion.
# `resize` re-applies the rail to every window, which is what makes a reload
# adopt the rail in windows that existed before it (the hooks only fire for
# windows created after). Without it, `Prefix r` would load the rail's config
# but leave the current windows rail-less until each was recreated.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# Prefix-based pane resizing with repeat (-r allows multiple presses without re-prefixing)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane navigation (C-hjkl), resize (M-hjkl) and swap (C-M-hjkl) are provided
# by the aserowy/tmux.nvim TPM plugin — nvim-aware, no manual bindings needed.

# Split panes. LazyVim mnemonic (the key matches the split line you
# get), kept identical across tmux and nvim (<leader>| / <leader>- there):
#   prefix | -> side-by-side   prefix - -> stacked
# Prefix v/h were the legacy vim-style duplicates of |- and --; removed
# 2026-09-27 so each split direction has exactly one key, the one that
# matches the shape of the split it makes.
# No run-shell here: pane border labels are maintained by the after-split-window
# hook below, so the split itself never forks a shell.
bind | split-window -h -c "#{?pane_current_path,#{pane_current_path},#{?@project_root,#{@project_root},#{session_path}}}"
bind - split-window -v -c "#{?pane_current_path,#{pane_current_path},#{?@project_root,#{@project_root},#{session_path}}}"

# New windows open in the project root directory (the session's project root)
# Fallback order: @project_root -> session_path -> pane_current_path
bind c new-window -c "#{?@project_root,#{@project_root},#{?session_path,#{session_path},#{pane_current_path}}}"

# Pane kill: x asks, X doesn't. Default tmux x kills instantly — after an
# accidental pane loss you never trust it again; confirm-before is what top
# configs converge on. The prompt is a command-prompt with 'y' prefilled:
# Enter kills (confirm), Esc cancels (command-prompt cancel under emacs
# status-keys, the default on this setup). Plain confirm-before can't do
# Esc-cancel with Enter-confirm on a prefilled value.
bind x command-prompt -I 'y' -p "kill-pane #P? (Enter=yes, Esc=no)" "kill-pane '%%'"
bind X kill-pane

# Sessionizer: fzf popup over ~/Projects, opens/switches to a session per project
bind f display-popup -t "  Projects " -E "~/.config/tmux/sessionizer.sh"

# Session switcher: fzf over ALL sessions (attached or not)
bind S display-popup -t "  Sessions " -E "~/.config/tmux/session-switcher.sh"

# Zoomed session/window tree: prefix+w is the fast navigational surface.
bind w choose-tree -Zw

# Popup utilities — all read the pane's cwd, so they act on whatever
# project is in front of you:
#   g lazygit        d lazydocker     b yazi (file manager)
# Sizing parity with nvim's lazygit float (lazygit.nvim defaults: scaling
# factor 0.9 -> 90% x 90%, rounded border chars, winblend 0). tmux popups
# can't do alpha, so parity = size + rounded border in @thm_blue
# (popup-border-style, set after the theme further down).
bind g display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "lazygit"
bind G display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "gh dash"
bind d display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "lazydocker"
bind b display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "yazi"
# Buffer history picker: interactive list of paste buffers (Prefix+y)
bind y choose-buffer -Z

# Project tasks: fzf menu (run/test/lint/format) over the pane's own project.
# The action opens in a NEW WINDOW, not the popup, so a dev server or watcher
# survives — same dispatcher as zed, wezterm and the pt* shell aliases
# (~/.local/bin/project-task => zed/tmux/wezterm all agree on the command).
bind P display-popup -w 60% -h 40% -d "#{pane_current_path}" -E "~/.config/tmux/project-task.sh '#{pane_current_path}'"
bind \; display-popup -w 60% -h 40% -d "#{pane_current_path}" -E "~/.config/tmux/project-task.sh '#{pane_current_path}'"

# monitoring popups: T = system (btop), V = GPU (nvtop)
bind T display-popup -w 90% -h 90% -E "btop"
bind V display-popup -w 90% -h 90% -E "nvtop"

# Detach: stock Prefix+d was consumed by the lazydocker popup above, so
# detach moved to Prefix+D (the shift-pairing matches x/X, s/S).
bind D detach-client

# Scratch popup — a throwaway shell that closes on exit. -d keeps it
# in the current pane's cwd so it's useful for one-off commands.
# NOTE: tmux only supports plain ${VAR} expansion — no ${VAR:-default}
# syntax (that's what caused the "invalid environment variable" error).
# $SHELL is always set under this setup, so fall back via the shell:
bind s display-popup -w 80% -h 75% -d "#{pane_current_path}" -E 'exec ${SHELL:-zsh}'

# Equalize panes: vim-style Ctrl-w =. Resets a hand-built layout after
# `display-popup` popups or a resize have left the panes uneven. This is the
# "restore order" key.
bind = select-layout even-horizontal

# Open the CURRENT window's path in a file manager (thunar/nautilus if present)
# bind O run-shell "xdg-open '#{pane_current_path}'"

# Window cycling without the prefix. Alt+Arrow, and the reason the wezterm
# readline binds (SUPER+LeftArrow -> ESC O H) had to go: with both in place
# tmux's root-table -n bind ate ESC O H before readline could use it, and
# removing it makes Alt+Arrow dead in the shell. Window cycling wins here;
# prefix+Arrow still reaches nvim, and readline keeps Alt+B/F if you need them.
# Do NOT move these to C-: nvim owns <C-Left/Right> for window resize.
bind -n M-Left previous-window
bind -n M-Right next-window

# Quick window jump WITHOUT prefix: Alt+1..9 (numrow). Learns fast, no
# prefix needed for the most common jump. (C-a 1..9 still works too.)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift+Arrow to move between panes without prefix (mouse-free, prefix-free;
# mirrors what modern terminals ship as their default pane motion)
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# Window swapping without prefix: Alt+Shift+Arrow moves the window
# left/right in the status bar (renumbering stays on)
bind -n M-S-Left swap-window -d -t -1
bind -n M-S-Right swap-window -d -t +1

# popup scrolling: PageUp enters copy-mode and pages up, so you can review
# output without a mouse.
#
# An unguarded `bind -n PageUp copy-mode -u` intercepts the key BEFORE the
# foreground app sees it, so PageUp stops working inside less/htop/man/nvim.
# Only take the bind when the pane is NOT running one of those. `-b` runs the
# test in a background shell so it never blocks the command queue on a keypress.
#
# Same idiom as plugins/tmux.nvim/tmux.nvim.tmux:15 -- ask `ps` what actually
# owns the pane's tty rather than trusting #{pane_current_command}, which lies
# about shells and is wrong for anything that forks.
#
# This is NOT tmux-sensible's doing -- sensible provides no PageUp binding at
# all (`grep -c PageUp plugins/tmux-sensible/sensible.tmux` -> 0).
bind -n PageUp if-shell -b "! ps -o comm= -t '#{pane_tty}' | grep -qE '(less|more|man|htop|btop|top|vim|nvim|view|emacs|psql|watch|fzf|lazygit|yazi)'" 'copy-mode -u'

# Keep more history (memory is cheap on 19GB, scrollback is gold)
set -g history-limit 100000

# No pane dimming in tmux — wezterm dims via inactive_pane_hsb instead.

# If this is your first time using tmux, you will need to press (Ctrl + Space) + I to fetch the plugins.
#
# NOTE on ordering: `run` blocks the config command queue while plugins load,
# and tmux-sensible guards each of its defaults with
# `option_value_not_changed <name> <sensible-default>`, so it only applies one
# when the value is still at sensible's expected default:
#   sensible.tmux:82  escape-time     -> 0     (skips if already != 500)
#   sensible.tmux:87  history-limit   -> 50000 (skips if already != 2000)
#   sensible.tmux:97  status-interval -> 5     (skips if already != 15)
# escape-time, history-limit and status-interval are all set ABOVE this line,
# which is the order that keeps them. escape-time 0 would break Alt-key
# detection, so don't move that one below without re-checking the result.
# (I tried to reproduce breakage by moving this line up in a throwaway copy;
# the probe socket never actually loaded the plugins, so that test proved
# nothing either way. The guard logic above is read from sensible.tmux, not
# observed at runtime.)

# Resolve terminal profile before TPM sources plugins: continuum/resurrect use
# the server socket and options during initialization. Unknown shells retain
# Kitty's legacy socket so existing sessions remain reachable.
if-shell '[ -z "$TERMINAL_STACK_PROFILE" ] && [ -n "$KITTY_WINDOW_ID" ]' 'set-environment -g TERMINAL_STACK_PROFILE kitty'
if-shell '[ -z "$TERMINAL_STACK_PROFILE" ] && [ -n "$WEZTERM_PANE" ]' 'set-environment -g TERMINAL_STACK_PROFILE wezterm'
if-shell '[ -z "$TERMINAL_STACK_PROFILE" ]' 'set-environment -g TERMINAL_STACK_PROFILE kitty'
if-shell '[ "$TERMINAL_STACK_PROFILE" = "wezterm" ]' 'set-environment -g TMUX_TMPDIR "~/.cache/tmux/wezterm"'
if-shell '[ "$TERMINAL_STACK_PROFILE" = "kitty" ]' 'set-environment -gu TMUX_TMPDIR'

run '~/.config/tmux/plugins/tpm/tpm'

# One wallpaper palette for both terminal profiles: kitty's own colors are
# regenerated from wezterm's resolved palette by utils/kitty-palette.sh, so the
# status bar can use the same matugen tokens everywhere. Profiles still keep
# separate sockets and resurrect directories.
source-file -q ~/.config/tmux/colors-matugen.conf
if-shell '[ "$TERMINAL_STACK_PROFILE" = "kitty" ]' 'set-option -g @resurrect-dir "~/.local/share/tmux/resurrect"'
if-shell '[ "$TERMINAL_STACK_PROFILE" = "wezterm" ]' 'set-option -g @resurrect-dir "~/.local/share/tmux/resurrect/wezterm"'
# Pane borders. Both colours are guarded tokens, but do not lean on that alone:
# inactive is @thm_surface_2 (2.8:1 on this wallpaper's bg) vs active
# @thm_blue (8.8:1) — that gap is wide in RATIO terms yet both are dim lines on
# a dark background, so on a bad day they read as "two similar faint lines".
# The non-colour cues below carry focus when the colours cannot.
# Pane borders: inactive uses @thm_overlay_1 (~5.1:1 contrast on dark wallpaper)
# ensuring splits remain clearly visible without muddy wash-out.
set -g pane-border-style "fg=#{@thm_overlay_1}"
# Active pane border: themed blue (wallpaper primary). Dynamic format expansion
# ensures the active border follows the wallpaper palette cascade.
set -gF pane-active-border-style "fg=#{@thm_blue}"
# Pane dividers: heavy draws distinct boundaries paired with pane-border-indicators.
set -g pane-border-lines heavy
# Non-colour focus cue. `both` = tmux 3.7 paints the active pane's border in
# BOLD *and* puts arrow markers on it, while the inactive border is neither.
set -g pane-border-indicators both
# Dynamic pane titlebars / process header badges: clean comma-free styling showing
# directory name when shell is running, or the command name otherwise.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#{@thm_blue}]#[bold],#[fg=#{@thm_overlay_1}]}[ #P: #{?#{m/r:(zsh|bash|sh|fish),#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}} ] "

# Clock mode: themed — adopt the wallpaper blue token (was the ANSI color
# named "blue", which ignored the matugen palette). `-gF` is required: colour
# options expand formats at set time, plain `set -g` silently rejects them.
set -gF clock-mode-colour "#{@thm_blue}"
set -g clock-mode-style 24

# ---- Popups (lazygit / lazydocker / yazi / prefix+s) -------------------
# Placed AFTER the theme so it wins, and using -gF so #{@thm_*} expands as a
# format — it is what makes the token expand at all (plain -g stores the
# literal `#{@thm_*}` string; tested on 3.7c). The palette file is re-sourced
# on wallpaper change, which re-expands these.
# Aesthetics mirror nvim: transparent interior (like the editor's
# `transparent_background`), border = the blue accent, rounded corners.
#
# tmux has no alpha — `bg=#rrggbbaa` and `bg=rgba(...)` are both rejected
# ("invalid style", tested on 3.7c), so there is no way to blend tmux's own
# colour with what is behind it. `bg=default` is the equivalent of nvim's
# `Normal bg = NONE`: tmux paints NO background for the popup, so wezterm's
# window background (the wallpaper, at its backdrop opacity) shows straight
# through. The whole popup — lazydocker, lazygit, yazi, the scratch shell —
# therefore reads as glass, exactly as nvim's floats do.
#
# Consequence to know: text now sits on the wallpaper. The backdrop opacity in
# config/appearance.lua -> utils/backdrops.lua (`opacity = 0.82`) is what keeps
# it readable, same as it does for nvim. Lower that number = more wallpaper.
set -g popup-border-lines rounded
# Default popup-style uses the themed text token so it is correct on any
# wallpaper (light or dark). The if-shell blocks below override this per
# TERMINAL_STACK_PROFILE; this is the fallback for unknown profiles.
set -gF popup-style "bg=default,fg=#{@thm_text}"
set -gF popup-border-style "fg=#{@thm_blue}"

# ---- Terminal-aware tmux styling ------------------------------------------
# Inside kitty (daily driver): popups get a solid surface fill for readability
# since kitty has no backdrop opacity lever. Inside wezterm (dev driver):
# popups stay transparent glass on the wallpaper.
if-shell -b '[ "$TERMINAL_STACK_PROFILE" = "kitty" ]' \
  'set -gF popup-style "bg=#{@thm_surface_0},fg=#{@thm_text}"'
if-shell -b '[ "$TERMINAL_STACK_PROFILE" = "wezterm" ]' \
  'set -gF popup-style "bg=default,fg=#{@thm_text}"'

# ---- Copy mode: OSC52 to system clipboard, vim motions -------------------
# NOTE: the canonical copy-mode-vi bind block is further down (with mode-keys vi
# and the explanatory comment). These four lines were an earlier duplicate — tmux
# kept the last-parsed copy, so they were harmless but confusing. Removed.

# ---- Session management: auto-save named sessions on detach ---------------
# prefix + C-s saves manually (resurrect), this auto-saves on every detach
# so you never lose a session even if you forget prefix+C-s.
set-hook -g client-detached 'run-shell ~/.config/tmux/scripts/auto-save-session.sh'

# ============================================================
# best-way additions (previous file: tmux.conf.bak-<date>)
# ============================================================

# Focus events: nvim's FocusGained/checktime autoreload and tmux.nvim sync
# depend on the terminal reporting focus changes.
set -g focus-events on

# Force full repaint when a client attaches or resizes — fixes stale
# dotted/garbled regions after window restore or half-screen stretching.
# On client-attached, also dynamically detects whether attached from WezTerm
# or Kitty and updates TERMINAL_STACK_PROFILE.
set -ga update-environment " TERMINAL_STACK_PROFILE WEZTERM_PANE TERM_PROGRAM"
set-hook -g client-attached 'run-shell ~/.config/tmux/scripts/on-client-attached.sh'
set-hook -g client-resized  'refresh-client'

# OSC52 clipboard: copy-mode yanks go straight to the OS clipboard
# (Ghostty/kitty support this). Combined with tmux 3.2+ `y` binding.
set -g set-clipboard on

# Extended keys: pass Ctrl/Shift/Alt combos and full function/arrow keys
# through to apps unmodified. Without it some shortcuts (Ctrl+Shift+letter,
# certain F-keys) get swallowed inside tmux — nvim and TUIs feel like keys
# "randomly don't work". Needs a modern outer term (kitty/wezterm both send
# the required sequences). Paired with the terminal-overrides Tc/Ss/Smulx
# block above.
set -g extended-keys on

# tmux.nvim resize steps: default 1 is too fine. x5 horizontal / y3
# vertical feels controllable without being sluggish (matches the
# popular christoomey-style setups).
set -g @tmux-nvim-resize-step-x 5
set -g @tmux-nvim-resize-step-y 3

# vi copy-mode: without this the copy-mode-vi binds below never fire,
# because tmux defaults to emacs keys in copy mode.
set -g mode-keys vi
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# vi-style copy mode selections (defaults on tmux 3.2+, harmless re-bind):
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# last-window: single press C-a l (the "flip" key, like vim's C-^).
# C-a C-a must stay send-prefix (set at the top) so a literal Ctrl-a
# still reaches the shell (zsh beginning-of-line) and nested tmux.
# Prefix+a is a tmux BUILT-IN default (last-window) — deleting a line from
# this file cannot remove it, it just stops shadowing the default. `unbind`
# below is what actually takes it away, so C-a a is not a third spelling
# of C-a C-a / C-a l.
bind l last-window
unbind a

# Cross-layer keymap dump: tmux + nvim + wezterm in ONE fzf list.
# Each layer has its own lookup already (C-a ?, Space+sk, wezterm key
# tables) — none of them answers "what does every layer bind for X",
# which is the question you actually have. `k` for keys.
bind k display-popup -w 85% -h 80% -d "#{pane_current_path}" -E "~/.config/tmux/keymap-dump.sh"

# resurrect: also save pane contents + shell history, so in-progress work
# in any pane survives restarts.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dump-shell-history 'on'
# Restore nvim sessions (mksession) on resurrect/continuum restore.
set -g @resurrect-strategy-nvim 'session'

# The plugin bootstrap runs above, before the profile-specific palette.
# Bind resurrect straight to the cloned scripts rather than tpm's wrapper, so
# save/restore keep working even if the bootstrap line above is ever removed.
bind C-s run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-r run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'
