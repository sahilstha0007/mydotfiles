git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
gui:
  showRandomTip: false
  border: rounded
  theme:
    activeBorderColor:
      - '#eac16c'
      - bold
    inactiveBorderColor:
      - '#998f80'
    selectedLineBgColor:
      - '#2e2921'
  sidePanelWidth: 0.33
  expandFocusedSidePanel: true
quitOnTopLevelReturn: true
disableStartupPopups: true
notARepository: quit
