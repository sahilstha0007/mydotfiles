git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
gui:
  showRandomTip: false
  border: rounded
  theme:
    activeBorderColor:
      - '#feb877'
      - bold
    inactiveBorderColor:
      - '#9e8e81'
    selectedLineBgColor:
      - '#312822'
  sidePanelWidth: 0.33
  expandFocusedSidePanel: true
quitOnTopLevelReturn: true
disableStartupPopups: true
notARepository: quit
