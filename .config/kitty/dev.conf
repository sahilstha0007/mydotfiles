# =============================================================================
# Kitty Profile: Dev — The High-Performance Developer Terminal
# Pure speed, zero distraction, maximum feature density.
# Features:
#   - Native splits with vim-friendly directional navigation
#   - Slanted Powerline tab bar with dynamic process icons & Right HUD (CWD/Bat/Clock)
#   - Interactive Neovim scrollback pager & FZF history search
#   - QuickSelect hints suite (URLs, filepaths, line numbers, git hashes)
#   - Integrated developer overlays: Yazi, Lazygit, Btop, Git Diff, Command Palette
#   - Smart ligatures (unfolds on cursor) & undercurl diagnostics
#   - Frosted glass opacity with ML4W particle cursor trail
# =============================================================================

# Include base Kitty configuration (desktop fonts, cursor trail, padding, window rules)
include $HOME/.config/kitty/kitty.conf

# Include Nightfox theme (exclusive to Kitty Dev profile)
include $HOME/.config/kitty/themes/nightfox.conf

# Profile Environment
env TERMINAL_STACK_PROFILE=kitty

# --- Visual Ergonomics & Clean Focus ---
# Frosted glass background with zero wallpaper distraction
background_opacity 0.88
dynamic_background_opacity yes
background_blur 20
window_padding_width 8

# Dim inactive panes so the active workspace pops
inactive_text_alpha 0.75
window_border_width 1.5pt

# --- Typography & Underline Diagnostics ---
# Programming ligatures enabled, but automatically unfolds under cursor for exact editing
disable_ligatures cursor
url_style curly
detect_urls yes
open_url_with default

# --- Scrollback & History ---
scrollback_lines 50000
scrollback_pager_history_size 16
wheel_scroll_multiplier 2.0
touch_scroll_multiplier 2.0
mouse_hide_wait 1.0

# --- Silky Animated Cursor & Breathing Ease ---
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_shape block
cursor_blink_interval 0.65 ease-in-out ease-in-out
cursor_stop_blinking_after 0
cursor_text_color background

# --- Performance & Responsiveness (60Hz VSync, zero tearing) ---
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Terminal Protocols, Notifications & IPC
allow_remote_control yes
allow_hyperlinks yes
notify_on_cmd_finish invisible 10.0
clipboard_control write-clipboard write-primary read-clipboard read-primary
shell_integration enabled

# Bell & Activity alerts (silent focus, no distracting red dots)
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
bell_on_tab no

# --- Modern Floating Rounded Pills Tab Bar with Process & Right-Status HUD ---
# Powered by ~/.config/kitty/tab_bar.py (Breadcrumb CWD, Battery monitor, Clock)
tab_bar_edge top
tab_bar_style custom
tab_powerline_style round
tab_bar_margin_width 6
tab_bar_margin_height 6 2
tab_bar_min_tabs 1
tab_title_max_length 28
tab_activity_symbol none
active_tab_font_style bold
inactive_tab_font_style normal

# Tab title templates (process badges handled directly in tab_bar.py PROCESS_ICONS)
tab_title_template "{title[:20]}"
active_tab_title_template "{title[:25]}{f' [{num_windows}]' if num_windows > 1 else ''}{' 󰁌' if layout_name == 'stack' else ''}"

# --- Native Layout Engine ---
enabled_layouts splits,tall,fat,grid,stack

# Window Splits (match modern IDE ergonomics)
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current
map ctrl+shift+enter launch --cwd=current

# Stack / Zoom Toggle (matches tmux Prefix+z)
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout

# Seamless Window Navigation across Kitty Splits & Neovim (matches tmux / vim)
map ctrl+h kitten pass_keys.py left ctrl+h
map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top ctrl+k
map ctrl+l kitten pass_keys.py right ctrl+l

# Unconditional Window Navigation (Explicit Fallback)
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

# Window Moving
map ctrl+shift+alt+left move_window left
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+up move_window up
map ctrl+shift+alt+down move_window down

# Window Resizing
map ctrl+shift+alt+h resize_window narrower 3
map ctrl+shift+alt+l resize_window wider 3
map ctrl+shift+alt+k resize_window taller 3
map ctrl+shift+alt+j resize_window shorter 3
map ctrl+shift+alt+r resize_window reset

# --- Tab Navigation & Management ---
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+w close_tab
map ctrl+shift+q close_window
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+p>z toggle_layout stack
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# Reorder tabs left / right
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward

# Interactively rename tab title
map ctrl+shift+alt+t set_tab_title

# Interactive Fuzzy Tab & Window Switcher
map ctrl+shift+tab launch --type=overlay ~/.config/kitty/scripts/tab-switcher.sh
map ctrl+shift+p>t launch --type=overlay ~/.config/kitty/scripts/tab-switcher.sh

# --- Dual Scrollback Modes: Search & Full Neovim Pager ---
# 1. Fuzzy search scrollback with fzf overlay
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --exact -i --reverse
# 2. Interactive Neovim scrollback pager (full vim motions & clipboard yank)
map ctrl+shift+h launch --stdin-source=@screen_scrollback --type=overlay ~/.config/kitty/scripts/nvim-scrollback-pager.sh

# --- Synchronize Panes (Broadcast typing across all splits) ---
map ctrl+shift+b launch --allow-remote-control kitten broadcast --match-tab state:focused

# --- Interactive Command Palette & Kittens ---
map ctrl+shift+k kitten command_palette
map ctrl+shift+p>c kitten command_palette
map ctrl+shift+g launch --type=overlay --cwd=current kitten diff
map ctrl+shift+y launch --type=overlay --cwd=current yazi
map ctrl+shift+m launch --type=overlay btop
map ctrl+shift+p>g launch --type=overlay --cwd=current lazygit
map ctrl+shift+u kitten unicode_input

# --- WezTerm-Compatible QuickSelect & Hints Suite ---
# QuickSelect words directly to clipboard
map ctrl+shift+space kitten hints --type word --program @
# URLs directly to browser
map ctrl+shift+e open_url_with_hints
# Compiler Errors: jump straight into Neovim at exact file + line
map ctrl+shift+p>n kitten hints --type linenum --linenum-action=self nvim +{line} {path}
# Git Hashes: insert into prompt (-) or copy (@)
map ctrl+shift+p>h kitten hints --type hash --program -
map ctrl+shift+p>shift+h kitten hints --type hash --program @
# File Paths: insert into prompt (-) or open (default)
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>shift+f kitten hints --type path
# Lines: insert (-) or copy (@)
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>shift+l kitten hints --type line --program @
# Words & IPs
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>i kitten hints --type ip --program -

# --- Project Hub Interactive Overlay ---
map ctrl+shift+o launch --type=overlay ~/.config/kitty/scripts/project-hub.sh
map ctrl+shift+p>p launch --type=overlay ~/.config/kitty/scripts/project-hub.sh

# --- Dynamic Opacity Shortcuts ---
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default
map ctrl+shift+a>1 set_background_opacity 1.0

# --- Font Resizing ---
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
