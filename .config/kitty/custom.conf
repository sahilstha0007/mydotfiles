# Custom Kitty Configuration
# Loaded after colors-matugen.conf. Clean minimalism for tmux + nvim stack.

# Clean scrollback & smooth scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0
mouse_hide_wait 1.0

# Cursor styling
cursor_shape block
cursor_beam_thickness 1.5

# Keep clean window padding
window_padding_width 10

# Forward Super+x to tmux pane kill (prefix + x)
map super+x send_text all \x01x
