# Custom Kitty Configuration
# Loaded after colors-matugen.conf. Clean minimalism for tmux + nvim stack.

# Nightfox Theme & Frosted Glass View
include $HOME/.config/kitty/themes/nightfox.conf
background_opacity 0.85
dynamic_background_opacity yes
background_blur 32

# Ultra-Smooth Scrollback & Motion
scrollback_lines 10000
wheel_scroll_multiplier 2.0
touch_scroll_multiplier 2.0
mouse_hide_wait 1.0

# Silky Animated Cursor & Breathing Ease
cursor_shape block
cursor_beam_thickness 1.5
cursor_blink_interval 0.65 ease-in-out ease-in-out
cursor_stop_blinking_after 0
cursor_text_color background

# Smooth Particle Trail (silky decay curve)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Display Refresh Rate & Frame Pacing (60Hz VSync, zero tearing)
sync_to_monitor yes
repaint_delay 8
input_delay 2

# Keep clean window padding
window_padding_width 10

# Forward Super+x to tmux pane kill (prefix + x)
map super+x send_text all \x01x
