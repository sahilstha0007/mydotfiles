# =============================================================================
# Kanagawa theme for Kitty (Kitty coding profile)
# Upstream: https://github.com/rebelot/kanagawa.nvim
# Mirrors the structure of nightfox.conf: rounded pills + scrollbar polish.
# =============================================================================

# Special
background            #1f1f28
foreground            #dcd7ba
selection_background  #2d4f67
selection_foreground  #c8c093
url_color             #72a7bc
cursor                #c8c093
cursor_text_color     #1f1f28

# Borders
active_border_color   #7e9cd8
inactive_border_color #54546d
bell_border_color     #e6c384

# Tabs (Floating rounded pills)
active_tab_background   #2d4f67
active_tab_foreground   #dcd7ba
inactive_tab_background #16161d
inactive_tab_foreground #727169
tab_bar_background      none

# Normal ANSI Colors
color0  #16161d
color1  #c34043
color2  #76946a
color3  #c0a36e
color4  #7e9cd8
color5  #957fb8
color6  #6a9589
color7  #c8c093

# Bright ANSI Colors
color8  #727169
color9  #e82424
color10 #98bb6c
color11 #e6c384
color12 #7fb4ca
color13 #938aa9
color14 #7aa89f
color15 #dcd7ba

# Extended Palette
color16 #ffa066
color17 #ff5d62

# Scrollbar polish (Kanagawa-matched) — custom.conf sets these too.
scrollbar_handle_color #7e9cd8
scrollbar_track_color  #16161d
cursor_trail_color     #7fb4ca
