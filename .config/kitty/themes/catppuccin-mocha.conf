# =============================================================================
# Catppuccin Mocha theme for Kitty (Kitty coding profile)
# Upstream: https://github.com/catppuccin/kitty
# Mirrors the structure of nightfox.conf: rounded pills + scrollbar polish.
# =============================================================================

# Special
background            #1E1E2E
foreground            #CDD6F4
selection_background  #45475A
selection_foreground  #CDD6F4
url_color             #89B4FA
cursor                #F5E0DC
cursor_text_color     #1E1E2E

# Borders
active_border_color   #CBA6F7
inactive_border_color #585B70
bell_border_color     #F9E2AF

# Tabs (Floating rounded pills)
active_tab_background   #CBA6F7
active_tab_foreground   #11111B
inactive_tab_background #181825
inactive_tab_foreground #A6ADC8
tab_bar_background      none

# Normal ANSI Colors
color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE

# Bright ANSI Colors
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #CDD6F4

# Extended Palette
color16 #FAB387
color17 #F5C2E7

# Scrollbar polish (Catppuccin-matched) — custom.conf sets these too, kept here
# so the theme is self-contained if included directly.
scrollbar_handle_color #CBA6F7
scrollbar_track_color  #181825
cursor_trail_color     #89B4FA
