# =============================================================================
# Apple Dark Glass theme for Kitty (Kitty coding profile)
# macOS dark-mode system colors + restrained Apple design language.
# Grayscale hierarchy, one accent (#0a84ff), softened system-hue ANSI colors.
# Pairs with custom.conf: background_opacity 0.88, background_blur 40.
# =============================================================================

# Special — Apple label colors
background            #1c1c1e
foreground            #f5f5f7
selection_background  #0a84ff
selection_foreground  #ffffff
url_color             #0a84ff
cursor                #0a84ff
cursor_text_color     #ffffff

# Borders — hairline, one accent
active_border_color   #0a84ff
inactive_border_color #3a3a3c
bell_border_color     #ff9f0a

# Tabs — unified surface, accent only on active
active_tab_background   #0a84ff
active_tab_foreground   #ffffff
inactive_tab_background #2c2c2e
inactive_tab_foreground #a1a1a6
tab_bar_background      none

# Normal ANSI Colors — softened Apple system tones (>=4.5:1 on #1c1c1e)
color0  #3a3a3c
color1  #ff6b6b
color2  #7dce8b
color3  #f2d97a
color4  #0a84ff
color5  #cba6f0
color6  #64d2ff
color7  #ebebf5

# Bright ANSI Colors
color8  #6e6e73
color9  #ff8a80
color10 #a3e5ae
color11 #f7e6a3
color12 #5aa9ff
color13 #dcb8f5
color14 #9fdcf5
color15 #f5f5f7

# Extended Palette
color16 #ff9f0a
color17 #ff375f

# Scrollbar / trail — accent blue, hairline track
scrollbar_handle_color #0a84ff
scrollbar_track_color  #2c2c2e
cursor_trail_color     #0a84ff
