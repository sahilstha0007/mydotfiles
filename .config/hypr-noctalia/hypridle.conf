# Dedicated hypridle for the Hyprland + Noctalia TEST session.
# No lock_cmd and no before_sleep_cmd: Noctalia owns session lock and
# lock-before-suspend via logind PrepareForSleep. Lock-on-sleep will be
# re-added before this becomes the daily session.

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 480
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
