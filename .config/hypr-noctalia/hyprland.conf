-- Window management
local function ws_float_smart()
  local ws = hl.get_active_special_workspace() or hl.get_active_workspace()
  if not ws then return end
  local windows = hl.get_workspace_windows(ws)
  local any_floating = false
  for _, w in ipairs(windows) do
    if w.floating then any_floating = true; break end
  end
  local action = any_floating and "disable" or "enable"
  for _, w in ipairs(windows) do
    hl.dispatch(hl.dsp.window.float({ action = action, window = w }))
  end
end
