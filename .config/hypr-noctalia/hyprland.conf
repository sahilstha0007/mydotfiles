-- Hyprland + Noctalia TEST session.
-- Fully separate from ~/.config/hypr (ML4W). Lua API required by Hyprland 0.57.

-- Environment ported from ML4W so cursor/GTK/Qt/toolkit appearance matches.
-- QT_QPA_PLATFORMTHEME=qt6ct uses your existing Breeze/darker qt6ct config;
-- if the screen-share picker crashes recur, switch that config's style to Fusion.
hl.env("OZONE_PLATFORM", "wayland")
hl.env("ELECTRON_OZONE_PLATFORM_HINT", "wayland")
hl.env("QT_QPA_PLATFORM", "wayland;xcb")
-- hl.env("QT_QPA_PLATFORMTHEME", "qt6ct")  -- disabled for first days: Breeze theme is a picker-crash suspect
hl.env("QT_WAYLAND_DISABLE_WINDOWDECORATION", "1")
hl.env("GDK_SCALE", "1")
hl.env("GDK_BACKEND", "wayland,x11,*")
hl.env("CLUTTER_BACKEND", "wayland")
hl.env("MOZ_ENABLE_WAYLAND", "1")
hl.env("XCURSOR_THEME", "Bibata-Modern-Ice")
hl.env("XCURSOR_SIZE", "24")
hl.env("HYPRCURSOR_SIZE", "24")
hl.env("SDL_VIDEODRIVER", "wayland")
-- GTK theme (WhiteSur-Dark-solid / WhiteSur-dark / prefer-dark, Fira Sans 11)
-- is already persisted in gsettings org.gnome.desktop.interface by ML4W's gtk.sh.

hl.config({
    general = {
        gaps_in = 6,
        gaps_out = 12,
        border_size = 2,
        ["col.active_border"] = "rgba(89b4faff)",
        ["col.inactive_border"] = "rgba(313244ff)",
        layout = "dwindle",
    },
    decoration = {
        rounding = 10,
        blur = { enabled = false },
        shadow = { enabled = false },
    },
    animations = {
        enabled = false,
    },
    input = {
        kb_layout = "us",
        follow_mouse = 1,
        touchpad = { natural_scroll = true },
    },
    dwindle = {
        preserve_split = true,
    },
    binds = {
        allow_workspace_cycles = true,
        pass_mouse_when_bound = false,
        scroll_event_delay = 1,
    },
    misc = {
        disable_hyprland_logo = true,
        disable_splash_rendering = true,
        allow_session_lock_restore = true,
    },
    xwayland = {
        force_zero_scaling = true,
    },
})

hl.monitor({
    output = "eDP-1",
    mode = "1920x1080@60.02",
    position = "0x0",
    scale = 1.0,
    vrr = 0,
})

-- Touchpad gestures ported from the current ML4W config
hl.gesture({ fingers = 3, direction = "vertical", action = "workspace" })
hl.gesture({ fingers = 3, direction = "horizontal", action = "scroll_move", scale = 0.9 })
hl.gesture({ fingers = 4, direction = "pinchout", action = function ()
    hl.dispatch(hl.dsp.window.fullscreen({ action = "set" }))
end})
hl.gesture({ fingers = 4, direction = "pinchin", action = function ()
    hl.dispatch(hl.dsp.window.fullscreen({ action = "unset" }))
end})

-- Window rules
hl.window_rule({
    name = "zen-opacity",
    match = { class = "^(zen)$" },
    opacity = "1.0 1.0",
})
hl.window_rule({
    name = "pavucontrol",
    match = { class = ".*org.pulseaudio.pavucontrol.*" },
    float = true,
    center = true,
    size = "700 600",
})
hl.window_rule({
    name = "Picture-in-Picture",
    match = {
        title = [[^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$]]
    },
    float = true,
    pin = true,
    focus_on_activate = false,
    no_initial_focus = true,
    suppress_event = "activate"
})
hl.window_rule({
    name = "special-workspace-color",
    match = { workspace = "special:scratchpad" },
    border_color = "rgb(f5c2e4) rgb(45475a)",
})
hl.window_rule({
    name = "gtk-file-dialog",
    match = { class = "xdg-desktop-portal-gtk" },
    float = true,
    center = true,
    size = "800 600",
})
hl.window_rule({
    name = "network-editor",
    match = { class = "nm-connection-editor" },
    float = true,
    center = true,
    size = "800 700",
})
hl.window_rule({
    name = "dotfiles-floating",
    match = { class = "dotfiles-floating" },
    float = true,
    center = true,
    size = "1000 700",
})

hl.layer_rule({
    name = "noctalia-no-anim",
    match = { namespace = "^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$" },
    no_anim = true,
})

-- Services. Noctalia owns lock/idle-lock AND clipboard history
-- (IPC: clipboard-clear/copy/text), so no cliphist watcher here.
-- hypridle has NO lock or lock-before-suspend command for the test phase.
hl.on("hyprland.start", function()
    -- Isolation: this session is NOCTALIA_SESSION=1 (set by the wrapper).
    -- Stop ML4W-only background services/daemons so they do not leak here.
    hl.exec_cmd(os.getenv("HOME") .. "/.config/hypr-noctalia/isolate-ml4w.sh &")
    hl.exec_cmd("dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE")
    hl.exec_cmd("systemctl --user start hyprpolkitagent.service")
    hl.exec_cmd("hypridle -c " .. os.getenv("HOME") .. "/.config/hypr-noctalia/hypridle.conf")
    hl.exec_cmd("noctalia")
end)

