-- Services. Noctalia owns lock/idle-lock AND clipboard history
-- (IPC: clipboard-clear/copy/text), so no cliphist watcher here.
-- hypridle has NO lock or lock-before-suspend command for the test phase.
hl.on("hyprland.start", function()
    -- Isolation: this session is NOCTALIA_SESSION=1 (set by the wrapper).
    -- Stop ML4W-only background services/daemons so they do not leak here.
    hl.exec_cmd(os.getenv("HOME") .. "/.config/hypr-noctalia/isolate-ml4w.sh &")
    hl.exec_cmd("dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE")
    hl.exec_cmd("systemctl --user start hyprpolkitagent.service")
    hl.exec_cmd("hypridle -c " .. os.getenv("HOME") .. "/.config/hypr-noctalia/hypridle.conf")
    hl.exec_cmd("noctalia")
end)

local function special_visibility(ws)
    local name = ""
    if ws ~= nil then
        local ok, value = pcall(function() return tostring(ws.name) end)
        if ok and value ~= nil then name = value end
    end
    local raw = ws ~= nil and tostring(ws) or ""
    local enter = "0"
    if name:find("special:", 1, true) and not raw:find("expired", 1, true) then enter = "1" end
    hl.exec_cmd(os.getenv("HOME") .. "/.local/bin/ml4w-bridge.sh special-workspace " .. enter)
end
hl.on("workspace.active", special_visibility)
hl.on("workspace.special_active", special_visibility)

