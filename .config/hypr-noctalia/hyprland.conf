hl.bind("SUPER + SHIFT + S", function()
    hl.dispatch(hl.dsp.window.float({ action = "toggle" }))
    hl.dispatch(hl.dsp.window.move({ workspace = "special:scratchpad" }))
    hl.dispatch(hl.dsp.window.set_prop({ prop = "active_border_color", value = "rgba(f5c2e4ff)" }))
    hl.dispatch(hl.dsp.window.set_prop({ prop = "inactive_border_color", value = "rgba(45475aff)" }))
end, { description = "Move window to special workspace with pink border marker" })
hl.bind("SUPER + CTRL + SHIFT + S", hl.dsp.exec_cmd(os.getenv("HOME") .. "/.local/bin/ml4w-bridge.sh scratchpad"), { description = "Toggle kitty+tmux scratchpad" })

-- Scroll through workspaces with Super + mouse wheel (ML4W)
local scroll_locked = false
local function throttled_scroll(dispatcher)
    return function()
        if scroll_locked then return end
        scroll_locked = true
        hl.dispatch(dispatcher)
        hl.timer(function() scroll_locked = false end, { timeout = 200, type = "oneshot" })
    end
end
hl.bind("SUPER + mouse_down", throttled_scroll(hl.dsp.focus({ workspace = "e+1" })), { description = "Next workspace (ML4W)" })
hl.bind("SUPER + mouse_up", throttled_scroll(hl.dsp.focus({ workspace = "e-1" })), { description = "Previous workspace (ML4W)" })

-- Media / brightness
-- Noctalia IPC drives its own OSD for these
hl.bind("XF86AudioRaiseVolume", hl.dsp.exec_cmd("noctalia msg volume-up 5"), { locked = true, repeating = true, description = "Raise volume" })
hl.bind("XF86AudioLowerVolume", hl.dsp.exec_cmd("noctalia msg volume-down 5"), { locked = true, repeating = true, description = "Lower volume" })
hl.bind("XF86AudioMute", hl.dsp.exec_cmd("noctalia msg volume-mute"), { locked = true, description = "Mute audio" })
hl.bind("XF86MonBrightnessUp", hl.dsp.exec_cmd("noctalia msg brightness-up 5%"), { locked = true, repeating = true, description = "Increase brightness" })
hl.bind("XF86MonBrightnessDown", hl.dsp.exec_cmd("noctalia msg brightness-down 5%"), { locked = true, repeating = true, description = "Decrease brightness" })
hl.bind("XF86AudioMicMute", hl.dsp.exec_cmd("noctalia msg mic-mute"), { locked = true, description = "Mute microphone with OSD" })
hl.bind("XF86AudioNext", hl.dsp.exec_cmd("playerctl next"), { locked = true, description = "Next track (ML4W)" })
hl.bind("XF86AudioPrev", hl.dsp.exec_cmd("playerctl previous"), { locked = true, description = "Previous track (ML4W)" })
hl.bind("XF86AudioPlay", hl.dsp.exec_cmd("playerctl play-pause"), { locked = true, description = "Play/pause (ML4W)" })
hl.bind("XF86AudioPause", hl.dsp.exec_cmd("playerctl play-pause"), { locked = true, description = "Pause (ML4W)" })
