# Zen prompt — oh-my-posh (Nightfox Profile for Kitty)
console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true
shell_integration = true

[secondary_prompt]
  template = '❯❯ '
  foreground = '#8db9a3'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}#e19dae{{end}}', '{{if eq .Code 0}}#8db9a3{{end}}']

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '{{ .Path }}'
    foreground = '#90b2df'
    background = 'transparent'
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'folder'

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    template = '{{ .FormattedMs }}'
    foreground = '#dbc074'
    background = 'transparent'
    type = 'executiontime'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 5000

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '❯'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}#e19dae{{end}}', '{{if eq .Code 0}}#8db9a3{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'
