# Vendored third-party nvim plugins are not our code. Their parser hash tables
# (treesitter parsers.lua) and test fixtures trigger false positives (git SHAs
# look like sourcegraph tokens; redacted keys look like private keys). Allowlist
# the whole vendor tree; our own committed code is still fully scanned.
[extend]
useDefault = true

[allowlist]
description = "vendored third-party plugin sources"
paths = [
  '''(^|/)\.config/nvim/vendor/''',
]
